name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  open-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip && pip install -e . pytest
      - run: pytest tests -q
      - name: phase0 post-processors compile and self-check
        run: |
          python -m py_compile ops/phase0/*.py
          bash -n ops/phase0/*.sh
      - run: crovia --help
